# ───────────────────────────────────────────────────────────────
# CI Orchestrator (Full Integrated Lanes)
# Purpose: Run lint/typecheck, unit, and full E2E workflows in parallel
#          with artifacts, coverage %, and unified PR summary.
# ───────────────────────────────────────────────────────────────

name: CI Orchestrator (Full)

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write

env:
  NODE_ENV: test
  CI_ARTIFACT_PATH: latch-auth-ci-artifacts
  DATABASE_URL: postgresql://latch:latch123@localhost:5432/latch_auth
  REDIS_URL: redis://localhost:6379
  EVENT_SIGNING_SECRET: mock-signing-secret
  AWS_REGION: us-east-1

jobs:
  lint-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    outputs:
      lint-summary: ${{ steps.summary.outputs.text }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install deps (lint lane)
        working-directory: apps/latch-auth
        run: bun install --frozen-lockfile

      - name: Run Typecheck
        working-directory: apps/latch-auth
        run: bunx tsc --noEmit --project tsconfig.lint.json

      - name: Run Lint
        working-directory: apps/latch-auth
        run: bunx eslint "src/**/*.ts" || true

      - name: Generate Lint Summary
        id: summary
        working-directory: apps/latch-auth
        run: |
          # Run the same lint command as defined in package.json which should work
          bun run lint 2>/dev/null || LINT_EXIT_CODE=$?
          if [ "$LINT_EXIT_CODE" -eq 0 ] || [ "$LINT_EXIT_CODE" -eq 1 ]; then # 0=success, 1=lint errors found but no other issues
            # Count errors by running with --quiet and seeing if output is empty
            LINT_OUTPUT=$(bun run lint -- --quiet 2>&1)
            if [ -z "$LINT_OUTPUT" ]; then
              SUMMARY="✅ Lint passed"
            else
              ERR_COUNT=$(echo "$LINT_OUTPUT" | wc -l)
              SUMMARY="❌ Lint issues found ($ERR_COUNT items)"
            fi
          else
            echo "❌ Lint command failed with exit code $LINT_EXIT_CODE"
            SUMMARY="❌ Lint command failed"
          fi
          echo "text=$SUMMARY" >> $GITHUB_OUTPUT
      - name: Upload Lint Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latch-auth-lint-results
          path: apps/latch-auth/latch-auth-ci-artifacts/junit.xml
          if-no-files-found: ignore
  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
        
      - name: Install dependencies (initial)
        working-directory: apps/latch-auth
        run: bun install --frozen-lockfile # This ensures a baseline based on the committed lockfile initially
        
      - name: Apply dependency resolutions and regenerate lockfile
        working-directory: apps/latch-auth
        run: |
          echo "Applying 'resolutions' from package.json and running bun install..."
          # This command will read the new 'resolutions' field, force those package versions,
          # and regenerate the bun.lockb file.
          bun install
          
          echo "Forced updates complete. Proceeding to audit."

      - name: Run security audit
        working-directory: apps/latch-auth
        run: bun audit --audit-level moderate # This should now audit the forced, patched versions
        
      - name: Check for forbidden imports
        working-directory: apps/latch-auth
        run: |
          echo "Checking for dangerous imports..."
          DANGEROUS_IMPORTS=("child_process" "fs" "vm" "eval" "exec" "spawn" "require" "import")
          for IMPORT in "${DANGEROUS_IMPORTS[@]}"; do
            if grep -r "from.*$IMPORT\|require.*$IMPORT\|import.*$IMPORT" ./src --include="*.ts" --exclude-dir=node_modules; then
              echo "❌ Found dangerous import: $IMPORT"
               exit 1
             fi
          done
          echo "✅ No dangerous imports found"         
  coverage:
    name: Coverage Validation
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          name: latch-auth-unit-results
          path: apps/latch-auth/

      - name: Debug - Check lcov.info content and match patterns with correct field separator
        run: |
          echo "File type:"
          file apps/latch-auth/coverage/lcov.info
          echo "Checking for LF: lines (verbose awk with -F:):"
          awk -F: '/^LF:/ { print "Found LF line:", $0, "Value:", $2; sum += $2 } END { print "Sum of LF:", sum+0 }' apps/latch-auth/coverage/lcov.info
          echo "Checking for LH: lines (verbose awk with -F:):"
          awk -F: '/^LH:/ { print "Found LH line:", $0, "Value:", $2; sum += $2 } END { print "Sum of LH:", sum+0 }' apps/latch-auth/coverage/lcov.info

      - name: Check coverage thresholds
        run: |
          # Check if coverage meets minimum thresholds (690%)
          if [ -f "apps/latch-auth/coverage/lcov.info" ]; then
            # Extract overall line coverage by summing LF and LH across all records
            # Use -F: to split fields on the colon character
            COVERAGE=$(awk -F: '
              /^LF:/ { total_lines += $2 }
              /^LH:/ { hit_lines += $2 }
              END {
                if (total_lines > 0) {
                  printf "%.0f", (hit_lines/total_lines)*100
                } else {
                  print 0  # If no lines found, coverage is 0%
                }
              }
            ' apps/latch-auth/coverage/lcov.info)
            echo "Current coverage: ${COVERAGE}%"
              
            if [ "$COVERAGE" -lt 69 ]; then
              echo "❌ Coverage ${COVERAGE}% is below threshold 69%"
              exit 1
            fi
            echo "✅ Coverage ${COVERAGE}% meets threshold"
          else
              echo "❌ Coverage report not found at apps/latch-auth/coverage/lcov.info"
              exit 1
            fi
  unit:
    name: Unit Tests (fast)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: latch_auth
        ports: ["5432:5432"]
      redis: 
        image: redis:7
        ports: ["6379:6379"]
    outputs:
      unit-summary: ${{ steps.summary.outputs.text }}
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest

    - name: Install & Run Unit Tests
      working-directory: apps/latch-auth
      env:
        NODE_ENV: test
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/latch_auth
        REDIS_URL: redis://localhost:6379
        EVENT_SIGNING_SECRET: mock-signing-secret
        AWS_REGION: us-east-1
      run: |
        mkdir -p latch-auth-ci-artifacts
        bun install --frozen-lockfile
        npx prisma generate
        bunx jest --ci --runInBand --no-colors --coverage --coverageDirectory latch-auth-ci-artifacts/coverage --forceExit 2>&1 | tee test-output.log
            
    - name: Debug - Check JUnit file exists
      working-directory: apps/latch-auth # Ensure we are looking in the right place
      run: |
        echo "Looking for junit.xml at: latch-auth-ci-artifacts/junit.xml"
        if [ -f latch-auth-ci-artifacts/junit.xml ]; then
          echo "✅ junit.xml EXISTS"
          ls -la latch-auth-ci-artifacts/
        else
          echo "❌ junit.xml does NOT exist at latch-auth-ci-artifacts/junit.xml"
          echo "Contents of apps/latch-auth/:"
          ls -la
          echo "Contents of latch-auth-ci-artifacts/ (if it exists):"
          ls -la latch-auth-ci-artifacts/ 2>/dev/null || echo "latch-auth-ci-artifacts/ does not exist"
        fi

    - name: Extract Coverage from Log
      id: coverage
      working-directory: apps/latch-auth
      run: |
        COV=$(awk '/All files[[:space:]]+\|/ {
          gsub(/\|/, " ");
          for(i=1; i<=NF; i++) if($i ~ /^[0-9]+\.[0-9]+$/) {
            printf "%.0f", $5; exit;
          }
        }' test-output.log || echo 0)
        echo "coverage=$COV" >> $GITHUB_OUTPUT
      
    - name: Install xmllint
      run: sudo apt-get update && sudo apt-get install -y libxml2-utils    

    - name: Generate Unit Test Summary
      id: summary
      working-directory: apps/latch-auth
      run: |
        if [ -f "latch-auth-ci-artifacts/junit.xml" ]; then
          TOTAL=$(xmllint --xpath 'string(count(//testcase))' latch-auth-ci-artifacts/junit.xml)
          FAILURES=$(xmllint --xpath 'string(count(//testcase[failure]))' latch-auth-ci-artifacts/junit.xml)
          COV=${{ steps.coverage.outputs.coverage }}
          if [ "$FAILURES" -eq 0 ]; then
            SUMMARY="✅ Unit tests passed ($TOTAL tests) | Coverage: ${COV}%"
          else
            SUMMARY="❌ Unit tests failed: $FAILURES/$TOTAL failed | Coverage: ${COV}%"
          fi
        else
          SUMMARY="❌ JUnit XML not found"
        fi
        echo "text=$SUMMARY" >> $GITHUB_OUTPUT

    - name: Debug - Check artifact directory exists
      working-directory: apps/latch-auth
      run: |
        echo "Checking if directory exists: ${{ env.CI_ARTIFACT_PATH }}"
        if [ -d "${{ env.CI_ARTIFACT_PATH }}" ]; then
          echo "✅ Directory ${{ env.CI_ARTIFACT_PATH }} EXISTS"
          ls -la "${{ env.CI_ARTIFACT_PATH }}"
        else
          echo "❌ Directory ${{ env.CI_ARTIFACT_PATH }} does NOT exist"
          ls -la # List the contents of apps/latch-auth
        fi    

    - name: Upload Unit Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: latch-auth-unit-results
        path: apps/latch-auth/${{ env.CI_ARTIFACT_PATH }}
        if-no-files-found: ignore

  security-tests:
      name: Security Tests
      runs-on: ubuntu-latest
      needs: [unit, e2e]  # Run after unit and e2e tests pass
      services:
        postgres:
          image: postgres:15
          env:
            POSTGRES_USER: latch
            POSTGRES_PASSWORD: latch123
            POSTGRES_DB: latch_auth
          ports: ["5432:5432"]
          options: >-
            --health-cmd="pg_isready -U latch -d latch_auth"
            --health-interval=10s
            --health-timeout=5s
            --health-retries=5
        redis:
          image: redis:7
          ports: ["6379:6379"]
          options: >-
            --health-cmd="redis-cli ping"
            --health-interval=10s
            --health-timeout=5s
            --health-retries=5
      steps:
        - name: Checkout repo
          uses: actions/checkout@v4

        - name: Setup Bun
          uses: oven-sh/setup-bun@v1
          with:
            bun-version: latest

        - name: Install dependencies
          working-directory: apps/latch-auth
          run: bun install --frozen-lockfile

        - name: Generate Prisma client
          working-directory: apps/latch-auth
          run: bunx prisma generate

        - name: Apply migrations
          working-directory: apps/latch-auth
          run: bunx prisma migrate deploy

        - name: Run security-focused tests
          working-directory: apps/latch-auth
          run: |
            # Run tests that specifically target security features
            bunx jest --testPathPatterns "security" "bot-detection" "ip-reputation" "rate-limiting" --ci --no-colors
          
  e2e:
    name: E2E + Coverage + Docker Validation
    runs-on: ubuntu-latest
    needs: unit
    outputs:
      e2e-summary: ${{ steps.summary.outputs.text }}
    services:
      postgres:
        image: postgres:15
        env:
            POSTGRES_USER: latch          
            POSTGRES_PASSWORD: latch123   
            POSTGRES_DB: latch_auth       
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U latch -d latch_auth"  
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Restore Bun & Node Modules Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun
            apps/latch-auth/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('apps/latch-auth/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Dependencies
        working-directory: apps/latch-auth
        run: bun install --frozen-lockfile

      - name: Install Postgres Client Tools # <-- Add this to use pg_isready
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Wait for Postgres to be ready # <-- Add this step
        run: |
          until pg_isready -h localhost -p 5432 -U latch; do
            echo "Waiting for database service 'postgres'..."
            sleep 2
          done
          echo "Database 'postgres' is ready and accepting connections."

      # - name: Apply Prisma Migrations
      #   working-directory: apps/latch-auth
      #   env:
      #     # This should use 'postgres' if that's where your services run
      #     DATABASE_URL: postgresql://latch:latch123@postgres:5432/latch_auth 
      #   run: npx prisma migrate deploy

      - name: Generate Prisma Client
        working-directory: apps/latch-auth
        run: npx prisma generate

      - name: Apply Prisma Migrations
        working-directory: apps/latch-auth
        run: npx prisma migrate deploy

      - name: Run Prisma Seed (Mock)
        working-directory: apps/latch-auth
        run: bun run prisma:seed

      - name: Verify Seed Presence
        working-directory: apps/latch-auth
        run: |
          bun prisma/seed-check.ts
      
      - name: Setup E2E Database Name
        id: db_name_gen
        run: echo "::set-output name=db_name::e2e_db_$(date +%s)"
      
                
      # - name: Run E2E Tests with Coverage
      #   working-directory: apps/latch-auth
      #   run: |
      #     mkdir -p apps/latch-auth/latch-auth-ci-artifacts
      #     timeout 300s bun test:e2e --ci --no-colors --coverage --coverageDirectory latch-auth-ci-artifacts/coverage || exit 1
      
      - name: Setup E2E Database Name
        id: generate_e2e_db_name 
        run: echo "::set-output name=db_name::e2e_db_$(date +%s)"

      - name: Create E2E Database using psql
        run: |
          DB_NAME=${{ steps.generate_e2e_db_name.outputs.db_name }}
          # Use psql to create the database connecting as the 'latch' user to 'latch_auth' db
          # PGPASSWORD is required for psql in non-interactive environments
          export PGPASSWORD=latch123
          psql -h localhost -p 5432 -U latch -d latch_auth -c "CREATE DATABASE $DB_NAME;"

      - name: Apply Prisma Migrations to E2E DB
        working-directory: apps/latch-auth
        # Temporarily override DATABASE_URL for this step to apply migrations to the *new* DB
        env:
          DATABASE_URL: postgresql://latch:latch123@localhost:5432/${{ steps.generate_e2e_db_name.outputs.db_name }}
        run: bunx prisma migrate deploy  

      - name: Run Prisma Seed (Mock) for E2E DB
        working-directory: apps/latch-auth
        env:
          DATABASE_URL: postgresql://latch:latch123@localhost:5432/${{ steps.generate_e2e_db_name.outputs.db_name }}
        run: bun run prisma:seed

      - name: Run E2E Tests with Coverage
        working-directory: apps/latch-auth
        # Update the reference here to use 'generate_e2e_db_name'
        env:
          DATABASE_URL: postgresql://latch:latch123@localhost:5432/${{ steps.generate_e2e_db_name.outputs.db_name }}
          # ... other env variables ...
        run: |
          mkdir -p latch-auth-ci-artifacts
          timeout 300s bun test:e2e --ci --no-colors --coverage --coverageDirectory latch-auth-ci-artifacts/coverage || exit 1  

      - name: Debug- Check coverage output
        working-directory: apps/latch-auth
        run: |
          ls -la latch-auth-ci-artifacts/
          ls -la latch-auth-ci-artifacts/coverage/ || echo "Coverage missing!"

      - name: Build Docker Image (Prod-like)
        working-directory: apps/latch-auth
        run: docker build --no-cache -t latch-auth:e2e -f Dockerfile .

      - name: Run Latch Auth Docker Container & Health Check
        run: |
          # Get the GitHub Actions network name
          NETWORK=$(docker network ls --format '{{.Name}}' | grep 'github_network')
          if [ -z "$NETWORK" ]; then
            echo "❌ No GitHub network found"
            exit 1
          fi
      
          # Run container on the same network as services
          docker run -d --rm --name latch_auth_test -p 3000:3000 \
            --network "$NETWORK" \
            -e DATABASE_URL="postgresql://latch:latch123@postgres:5432/latch_auth" \
            -e REDIS_URL="redis://redis:6379" \
            -e EVENT_SIGNING_SECRET="mock-signing-secret" \
            -e NODE_ENV=test \
            latch-auth:e2e
      
          echo "Waiting for Latch Auth API to boot..."
          for i in {1..40}; do
            if curl -fsS http://localhost:3000/v1/health >/dev/null 2>&1; then
              echo "✅ Latch Auth API healthy!"
              # Write health.json
              mkdir -p latch-auth-ci-artifacts
              echo '{"health":"ok","checkedAt":"'"$(date -u +"%Y-%m-%dT%H:%M:%SZ")"'"}' > latch-auth-ci-artifacts/health.json
              exit 0
            fi
            sleep 2
          done
      
          echo "❌ Latch Auth API failed to become healthy"
          docker logs latch_auth_test || true
          exit 1
          
      - name: Upload E2E Coverage & Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latch-auth-e2e-results
          path: apps/latch-auth/latch-auth-ci-artifacts

      - name: Generate E2E Summary
        id: summary
        working-directory: apps/latch-auth
        run: |
          if [ -f "latch-auth-ci-artifacts/coverage/lcov.info" ]; then
            # Compute total line coverage: sum(HITS) / sum(TOTAL) * 100
            E2E_COV=$(awk '
              /^SF:/ { in_file = 1 }
              /^DA:/ && in_file {
                split($0, a, ",");
                hits = a[2];
                total_lines++;
                if (hits > 0) covered_lines++;
              }
              END {
                if (total_lines > 0) {
                  pct = int(covered_lines * 100 / total_lines);
                  print pct;
                } else {
                  print 0;
                }
              }
            ' latch-auth-ci-artifacts/coverage/lcov.info)
          else
            E2E_COV=0
          fi
          echo "text=✅ E2E completed | Coverage: ${E2E_COV}%" >> $GITHUB_OUTPUT

      - name: Cleanup Docker
        if: always()
        run: docker ps -a --filter "name=latch_auth_test" -q | xargs -r docker rm -f || true

  post-summary:
    
    name: Post Unified CI Summary to PR
    runs-on: ubuntu-latest
    needs: [lint-typecheck, unit, e2e]
    
    steps:
        - name: Compute Overall Coverage
          id: overall
          run: |
            UNIT_COV=$(echo "${{ needs.unit.outputs.unit-summary }}" | grep -Eo '[0-9]+' | tail -1 || echo 0)
            E2E_COV=$(echo "${{ needs.e2e.outputs.e2e-summary }}" | grep -Eo '[0-9]+' | tail -1 || echo 0)
            UNIT_COV=${UNIT_COV:-0}
            E2E_COV=${E2E_COV:-0}
            if ! [[ "$UNIT_COV" =~ ^[0-9]+$ ]]; then UNIT_COV=0; fi
            if ! [[ "$E2E_COV" =~ ^[0-9]+$ ]]; then E2E_COV=0; fi
            AVG_COV=$(expr \( $UNIT_COV + $E2E_COV \) / 2)
            echo "Computed average coverage: ${AVG_COV}%"
            echo "coverage=${AVG_COV}%" >> $GITHUB_OUTPUT
                
        - name: Post unified PR comment
          uses: marocchino/sticky-pull-request-comment@v2
          with:
          #number: ${{ github.event.pull_request.number || '' }}
              header: "## 🟣 CI Orchestrator Summary"
              message: |
                ### Lint / Typecheck
                ${{ needs.lint-typecheck.outputs.lint-summary }}

                ### Unit Tests
                ${{ needs.unit.outputs.unit-summary }}

                ### E2E + Coverage
                ${{ needs.e2e.outputs.e2e-summary }}

                ### Overall Coverage
                ${{ steps.overall.outputs.coverage }}

                **Artifacts:**  
                - Unit: latch-auth-unit-results  
                - E2E Coverage & Results: latch-auth-e2e-results  
                - Lint: ci-results-lint.json