# ───────────────────────────────────────────────────────────────
# CI Orchestrator (Full Integrated Lanes)
# Purpose: Run lint/typecheck, unit, and full E2E workflows in parallel
#          with artifacts, coverage %, and unified PR summary.
# ───────────────────────────────────────────────────────────────

name: CI Orchestrator (Full)

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write

env:
  NODE_ENV: test
  CI_ARTIFACT_PATH: latch-auth-ci-artifacts
  DATABASE_URL: postgresql://latch:latch123@localhost:5432/latch_auth
  REDIS_URL: redis://localhost:6379
  EVENT_SIGNING_SECRET: mock-signing-secret
  AWS_REGION: us-east-1

jobs:
  lint-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    outputs:
      lint-summary: ${{ steps.summary.outputs.text }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install deps (lint lane)
        working-directory: apps/latch-auth
        run: bun install --frozen-lockfile

      - name: Run Typecheck
        working-directory: apps/latch-auth
        run: bunx tsc --noEmit

      - name: Run Lint
        working-directory: apps/latch-auth
        run: bunx eslint "src/**/*.ts" || true

      - name: Generate Lint Summary
        id: summary
        run: |
          ERR_COUNT=$(bunx eslint "src/**/*.ts" --quiet | wc -l || echo 0)
          if [ "$ERR_COUNT" -eq 0 ]; then
            echo "::set-output name=text::✅ Lint passed"
          else
            echo "::set-output name=text::❌ Lint issues found ($ERR_COUNT errors)"
          fi

      - name: Upload Lint Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-results-lint-report
          path: apps/latch-auth/latch-auth-ci-artifacts/junit.xml
          if-no-files-found: ignore

  unit:
    name: Unit Tests (fast)
    runs-on: ubuntu-latest
    outputs:
      unit-summary: ${{ steps.summary.outputs.text }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install & Run Unit Tests
        working-directory: apps/latch-auth
        env:
              NODE_ENV: test
              CI_ARTIFACT_PATH: latch-auth-ci-artifacts
              JEST_JUNIT_OUTPUT: ${{ env.CI_ARTIFACT_PATH }}/junit.xml
              DATABASE_URL: postgresql://postgres:postgres@localhost:5432/latch_auth
              REDIS_URL: redis://localhost:6379
              EVENT_SIGNING_SECRET: mock-signing-secret
              AWS_REGION: us-east-1
        run: |
              bun install --frozen-lockfile
              mkdir -p $CI_ARTIFACT_PATH       # ← must be before jest
              bunx jest --ci --no-colors \
                --reporters=default \
                --reporters=jest-junit \
                --outputFile="${{ env.CI_ARTIFACT_PATH }}/junit.xml" \
                --coverage \
                --coverageDirectory=coverage/unit

      - name: Debug JUnit XML
        working-directory: apps/latch-auth
        run: ls -l $CI_ARTIFACT_PATH

      - name: Generate Unit Test Summary
        id: summary
        run: |
          if [ -f "${{ env.CI_ARTIFACT_PATH }}/junit.xml" ]; then
            TOTAL=$(xmllint --xpath 'string(count(//testcase))' ${{ env.CI_ARTIFACT_PATH }}/junit.xml)
            FAILURES=$(xmllint --xpath 'string(count(//testcase[failure]))' ${{ env.CI_ARTIFACT_PATH }}/junit.xml)
            COVERAGE=$(grep -oP 'Lines.*\K[0-9]+' coverage/unit/lcov-report/index.html || echo 0)
            if [ "$FAILURES" -eq 0 ]; then
              SUMMARY="✅ Unit tests passed ($TOTAL tests) | Coverage: ${COVERAGE}%"
            else
              SUMMARY="❌ Unit tests failed: $FAILURES/$TOTAL failed | Coverage: ${COVERAGE}%"
            fi
          else
            SUMMARY="❌ Unit test results not found"
          fi
          echo "text=$SUMMARY" >> $GITHUB_OUTPUT

      - name: Upload Unit Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latch-auth-unit-results
          path: ${{ env.CI_ARTIFACT_PATH }}/junit.xml
          if-no-files-found: ignore

  e2e:
    name: E2E + Coverage + Docker Validation
    runs-on: ubuntu-latest
    needs: unit
    outputs:
      e2e-summary: ${{ steps.summary.outputs.text }}
    services:
      postgres:
        image: postgres:15
        env:
            POSTGRES_USER: latch          # ← was 'postgres'
            POSTGRES_PASSWORD: latch123   # ← was 'postgres'
            POSTGRES_DB: latch_auth       # ← was 'latchdb'
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U latch -d latch_auth"  
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Restore Bun & Node Modules Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun
            apps/latch-auth/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('apps/latch-auth/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Dependencies
        working-directory: apps/latch-auth
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client
        working-directory: apps/latch-auth
        run: bunx prisma generate

      - name: Apply Prisma Migrations
        working-directory: apps/latch-auth
        run: bunx prisma migrate deploy

      - name: Run Prisma Seed (Mock)
        working-directory: apps/latch-auth
        run: bun run prisma:seed

      - name: Verify Seed Presence
        working-directory: apps/latch-auth
        run: |
          bun prisma/seed-check.ts

      - name: Run E2E Tests with Coverage
        working-directory: apps/latch-auth
        run: |
          mkdir -p ${{ env.CI_ARTIFACT_PATH }}
          timeout 300s bun test:e2e --ci --no-colors \
            --coverage \
            --outputFile=${{ env.CI_ARTIFACT_PATH }}/junit.xml \
            --coverageDirectory=coverage/e2e \
            || (echo "❌ E2E tests failed or timed out!" && exit 1)

      - name: Build Docker Image (Prod-like)
        working-directory: apps/latch-auth
        run: docker build --no-cache -t latch-auth:e2e -f Dockerfile .

      - name: Run Latch Auth Docker Container
        run: |
          NETWORK=$(docker network ls --format '{{.Name}}' | grep github_network)
          
          docker run -d --rm --name latch_auth_test -p 3000:3000 \
            --network "$NETWORK" \
            -e DATABASE_URL="postgresql://latch:latch123@postgres:5432/latch_auth" \
            -e REDIS_URL="redis://redis:6379" \
            -e EVENT_SIGNING_SECRET="${{ env.EVENT_SIGNING_SECRET }}" \
            -e NODE_ENV=test \
            latch-auth:e2e
      
          echo "Waiting for Latch Auth API to boot..."
          for i in {1..40}; do
            if curl -fsS http://localhost:3000/v1/health >/dev/null 2>&1; then
              echo "✅ Latch Auth API healthy!"
              break
            fi
            sleep 2
          done

      - name: Health Check (/v1/health)
        run: |
          curl -f http://localhost:3000/v1/health || (echo "❌ Health check failed!" && exit 1)
          echo '{"health":"ok","checkedAt":"'"$(date -u +"%Y-%m-%dT%H:%M:%SZ")"'"}' > ${{ env.CI_ARTIFACT_PATH }}/health.json || true

      - name: Upload E2E Coverage & Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latch-auth-e2e-results
          path: |
            ${{ env.CI_ARTIFACT_PATH }}/*
            coverage/e2e
          if-no-files-found: ignore

      - name: Generate E2E Summary
        id: summary
        run: |
          E2E_COV=$(grep -oP 'Lines.*\K[0-9]+' coverage/e2e/lcov-report/index.html || echo 0)
          echo "::set-output name=text::✅ E2E completed | Coverage: ${E2E_COV}%"

      - name: Cleanup Docker
        if: always()
        run: docker ps -a --filter "name=latch_auth_test" -q | xargs -r docker rm -f || true

      - name: Compute Overall Coverage
        id: overall
        run: |
          UNIT_COV=$(echo "${{ needs.unit.outputs.unit-summary }}" | grep -Eo '[0-9]+' | tail -1 || echo 0)
          E2E_COV=$(echo "${{ needs.e2e.outputs.e2e-summary }}" | grep -Eo '[0-9]+' | tail -1 || echo 0)
      
          UNIT_COV=${UNIT_COV:-0}
          E2E_COV=${E2E_COV:-0}
      
          if ! [[ "$UNIT_COV" =~ ^[0-9]+$ ]]; then UNIT_COV=0; fi
          if ! [[ "$E2E_COV" =~ ^[0-9]+$ ]]; then E2E_COV=0; fi
      
          AVG_COV=$(( (UNIT_COV + E2E_COV) / 2 ))
          echo "Computed average coverage: ${AVG_COV}%"
          echo "coverage=${AVG_COV}%" >> $GITHUB_OUTPUT
                   
      - name: Post unified PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          number: ${{ github.event.pull_request.number || '' }}
          header: "## 🟣 CI Orchestrator Summary"
          message: |
            ### Lint / Typecheck
            ${{ needs.lint-typecheck.outputs.lint-summary }}

            ### Unit Tests
            ${{ needs.unit.outputs.unit-summary }}

            ### E2E + Coverage
            ${{ needs.e2e.outputs.e2e-summary }}

            ### Overall Coverage
            ${{ steps.overall.outputs.coverage }}

            **Artifacts:**  
            - Unit: latch-auth-unit-results  
            - E2E Coverage & Results: latch-auth-e2e-results  
            - Lint: ci-results/lint.json
