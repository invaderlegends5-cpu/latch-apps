name: Import Validation

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  import-validation:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
    
    - name: Check for forbidden imports
      run: |
        echo "Checking for dangerous imports..."
        # Check for dangerous imports that could be used maliciously
        DANGEROUS_IMPORTS=("child_process" "fs" "vm" "eval" "Function" "require" "import" "exec" "spawn")
        for IMPORT in "${DANGEROUS_IMPORTS[@]}"; do
          if grep -r "from.*$IMPORT\|require.*$IMPORT\|import.*$IMPORT" ./src --exclude-dir=node_modules; then
            echo "Found dangerous import: $IMPORT"
            exit 1
          fi
        done
        echo "No dangerous imports found!"