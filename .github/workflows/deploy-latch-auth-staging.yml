# ───────────────────────────────────────────────────────────────
# Latch Auth Staging Deploy + Verify  (Phase 4.2)
# Reference: done.pdf → Deployment verification pattern
# Purpose: Build, run, and validate the Latch Auth container in CI.
# ───────────────────────────────────────────────────────────────

name: Deploy Latch Auth (Staging Verify)

on:
  workflow_dispatch:
  push:
    branches: [ "dev" ]

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/latch_auth
  REDIS_URL: redis://redis:6379
  EVENT_SIGNING_SECRET: staging-signing-secret
  NODE_ENV: production

jobs:
  staging:
    name: Build + Verify Latch Auth Staging Container
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: latch_auth
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres -d latch_auth"
          --health-interval=10s --health-timeout=5s --health-retries=5

      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout latch-apps repo
        uses: actions/checkout@v4
        
      - name: Setup Bun Runtime # Need Bun to run Prisma commands
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies # Need node_modules for prisma
        working-directory: apps/latch-auth
        run: bun install --frozen-lockfile

      - name: Wait for DB Ready
        run: |
          echo "Waiting for PostgreSQL..."
          for i in {1..20}; do
            nc -z localhost 5432 && echo "Postgres is up!" && break
            sleep 2
          done
          if [ $i -eq 20 ]; then exit 1; fi

      - name: Apply Prisma Migrations
        working-directory: apps/latch-auth
        run: bunx prisma migrate deploy

      - name: Build Docker Image
        working-directory: apps/latch-auth
        run: docker build -t latch-auth:staging .

      # - name: Run Latch Auth (Background) and Verify Health
      #   working-directory: apps/latch-auth
      #   run: |
      #     docker run -d --name latch_auth_staging \
      #       --network host \
      #       -e DATABASE_URL="${{ env.DATABASE_URL }}" \
      #       -e REDIS_URL="${{ env.REDIS_URL }}" \
      #       -e EVENT_SIGNING_SECRET="${{ env.EVENT_SIGNING_SECRET }}" \
      #       -p 3000:3000 latch-auth:staging

      #     echo "Waiting for service to start..."
          
      #     # Use a single variable for health check status
      #     HEALTH_CHECK_SUCCESS=false

      #     for i in {1..25}; do
      #       if curl -f http://localhost:3000/v1/health >/dev/null 2>&1; then
      #         echo "✅ Latch Auth container is healthy!"
      #         HEALTH_CHECK_SUCCESS=true
      #         break
      #       fi
      #       sleep 3
      #     done
          
      #     if [ "$HEALTH_CHECK_SUCCESS" = "false" ]; then
      #       echo "❌ Health verification failed after waiting!"
      #       exit 1 # Fail the step if not healthy
      #     fi
          
      #     echo "✅ /v1/health verified successfully."


      - name: Run Latch Auth (Background) and Verify Health
        working-directory: apps/latch-auth
        run: |
          docker run -d --name latch_auth_staging \
            --network github-network # Use the GitHub Actions network, implicitly created
            # No need for -p flag with service network
            -e DATABASE_URL="postgresql://postgres:postgres@postgres:5432/latch_auth" \ # Use service name 'postgres'
            -e REDIS_URL="redis://redis:6379" \ # Use service name 'redis'
            -e EVENT_SIGNING_SECRET="${{ env.EVENT_SIGNING_SECRET }}" \
            -e NODE_ENV="${{ env.NODE_ENV }}" \ # Pass NODE_ENV too, might be important
            latch-auth:staging
    
          echo "Waiting for service to start..."
    
            # Use a single variable for health check status
          HEALTH_CHECK_SUCCESS=false
    
          for i in {1..25}; do
            # The container should be reachable via its exposed port on the service network
            # GitHub Actions usually sets up a network where services can communicate
            # Check if the container's port 3000 is accessible from the runner (this might need adjustment)
            # Often, the container's port is accessible directly on the runner when using services.
            if curl -f http://localhost:3000/v1/health >/dev/null 2>&1; then
              echo "✅ Latch Auth container is healthy!"
              HEALTH_CHECK_SUCCESS=true
              break
            fi
            sleep 3
          done
    
          if [ "$HEALTH_CHECK_SUCCESS" = "false" ]; then
            echo "❌ Health verification failed after waiting!"
            docker logs latch_auth_staging # Log container output to see why it failed
            exit 1 # Fail the step if not healthy
          fi
    
          echo "✅ /v1/health verified successfully."


      - name: Debug Staging Container Logs
        if: always() # Run this even if the previous step failed
        run: |
          echo "Dumping logs for debugging:"
          docker logs latch_auth_staging

      # - name: Verify /v1/health Endpoint
      #   run: |
      #     timeout 30s curl -f http://localhost:3000/v1/health || (echo "❌ Health verification failed!" && exit 1)
      #     echo "✅ /v1/health verified successfully."

      - name: Cleanup Containers
        if: always()
        run: docker rm -f latch_auth_staging || true
