name: Deploy Latch Auth

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "apps/latch-auth/**"
      - ".github/workflows/deploy-latch-auth.yml"
      # Note: charts/latch-auth/** is in latch-infra, so remove or handle via checkout

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  terraform-outputs:
    name: Get Terraform Outputs
    runs-on: ubuntu-latest
    outputs:
      ecr_url: ${{ steps.outputs.outputs.ecr_url }}
      rds_endpoint: ${{ steps.outputs.outputs.rds_endpoint }}
      redis_endpoint: ${{ steps.outputs.outputs.redis_endpoint }}
      iam_role_arn: ${{ steps.outputs.outputs.iam_role_arn }}
    steps:
      - name: Checkout latch-apps
        uses: actions/checkout@v4
        with:
          path: latch-apps

      - name: Checkout latch-infra
        uses: actions/checkout@v4
        with:
          repository: invaderlegends5-cpu/latch-infra
          path: latch-infra

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Get Terraform outputs
        id: outputs
        working-directory: latch-infra/terraform
        run: |
          terraform init -input=false
          echo "ecr_url=$(terraform output -raw ecr_repository_url)" >> $GITHUB_OUTPUT
          echo "rds_endpoint=$(terraform output -raw rds_endpoint)" >> $GITHUB_OUTPUT
          echo "redis_endpoint=$(terraform output -raw redis_endpoint)" >> $GITHUB_OUTPUT
          echo "iam_role_arn=$(terraform output -raw iam_role_arn)" >> $GITHUB_OUTPUT

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: terraform-outputs
    permissions:
      contents: read

    steps:
      - name: Checkout latch-apps
        uses: actions/checkout@v4
        with:
          path: latch-apps

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        working-directory: latch-apps
        run: |
          docker build -t "${{ needs.terraform-outputs.outputs.ecr_url }}:${{ env.IMAGE_TAG }}" \
            -f apps/latch-auth/Dockerfile \
            apps/latch-auth
          docker push "${{ needs.terraform-outputs.outputs.ecr_url }}:${{ env.IMAGE_TAG }}"

  helm-lint:
    name: Helm Lint & Dry Run
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout latch-infra
        uses: actions/checkout@v4
        with:
          repository: invaderlegends5-cpu/latch-infra
          path: latch-infra

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Helm lint
        working-directory: latch-infra
        run: helm lint charts/latch-auth

      - name: Helm dry-run
        working-directory: latch-infra
        run: |
          helm upgrade --install latch-auth charts/latch-auth \
            --dry-run --debug \
            --set image.repository=${{ needs.terraform-outputs.outputs.ecr_url }} \
            --set image.tag=${{ env.IMAGE_TAG }}

  deploy:
    name: Deploy via Helm
    runs-on: ubuntu-latest
    needs: helm-lint
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'

    steps:
      - name: Checkout latch-infra
        uses: actions/checkout@v4
        with:
          repository: invaderlegends5-cpu/latch-infra
          path: latch-infra

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Decode kubeconfig
        if: secrets.KUBECONFIG_BASE64 != ''
        run: echo "${{ secrets.KUBECONFIG_BASE64 }}" | base64 -d > $HOME/.kube/config

      - name: Helm deploy
        working-directory: latch-infra
        run: |
          helm upgrade --install latch-auth charts/latch-auth \
            --namespace latch-dev --create-namespace \
            --set image.repository=${{ needs.terraform-outputs.outputs.ecr_url }} \
            --set image.tag=${{ env.IMAGE_TAG }} \
            --set-string env.NODE_ENV=production \
            --set-string database.url="postgresql://latch:latch-local-password@${{ needs.terraform-outputs.outputs.rds_endpoint }}/latchdb" \
            --set-string redis.url="redis://${{ needs.terraform-outputs.outputs.redis_endpoint }}" \
            --set serviceAccount.annotations."eks\.amazonaws\.com/role-arn"=${{ needs.terraform-outputs.outputs.iam_role_arn }} \
            --set secrets.create=true \
            --set-string secrets.jwtSecret="${{ secrets.JWT_SECRET }}" \
            --set-string secrets.refreshSecret="${{ secrets.REFRESH_SECRET }}"

  version-tag:
    name: Auto Version Tag
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: write
    steps:
      - name: Automated SemVer tagging
        uses: googleapis/release-please-action@v4
        with:
          release-type: simple
          package-name: latch-auth
          token: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: Notify Success to Slack
    runs-on: ubuntu-latest
    needs: [deploy, version-tag]
    if: always()
    steps:
      - name: Slack notification
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_COLOR: ${{ job.status }}
          SLACK_TITLE: "Latch Auth Deploy (${{ github.ref_name }})"
          SLACK_MESSAGE: "Status: ${{ job.status }} | Tag: ${{ github.sha }}"