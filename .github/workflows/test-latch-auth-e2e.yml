# ───────────────────────────────────────────────────────────────
# Latch Auth CI: Unit + E2E + Coverage + Docker Validation
# Purpose: Fast feedback, full integration validation, and PR visibility
# ───────────────────────────────────────────────────────────────

name: Latch Auth CI (Unit + E2E + Coverage)

on:
  push:
    branches: ["dev", "main"]
  pull_request:
    branches: ["dev", "main"]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  # Non-default, secure test credentials
  DATABASE_URL: postgresql://latch:latch123@localhost:5432/latch_auth
  REDIS_URL: redis://localhost:6379
  EVENT_SIGNING_SECRET: mock-signing-secret
  NODE_ENV: test
  CI_ARTIFACT_PATH: apps/latch-auth/latch-auth-ci-artifacts
  AWS_REGION: us-east-1  # if needed for mocks or future steps

concurrency:
  group: latch-auth-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: 🧪 Unit Tests (no DB)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Cache Bun & Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun
            apps/latch-auth/node_modules
          key: bun-deps-${{ runner.os }}-lockfile-${{ hashFiles('apps/latch-auth/bun.lock') }}
          restore-keys: |
            bun-deps-${{ runner.os }}-

      - name: Install Dependencies
        working-directory: apps/latch-auth
        run: bun install --frozen-lockfile

      - name: Run Unit Tests
        working-directory: apps/latch-auth
        run: |
          bunx prisma generate
          bunx jest --ci --runInBand --no-colors --coverage 2>&1 | tee test-output.log
        # run: bun test --ci --no-colors

      - name: Upload Unit Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latch-auth-unit-results
          path: apps/latch-auth/junit.xml
          if-no-files-found: ignore

  e2e:
    name: 🧪 E2E + Integration + Coverage + Docker Validation
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: latch
          POSTGRES_PASSWORD: latch123
          POSTGRES_DB: latch_auth
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U latch -d latch_auth"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
        
      - name: Check for bun.lock
        id: bun_lock_check
        run: |
          if [ -f "apps/latch-auth/bun.lock" ]; then
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi    

      - name: Cache Bun & Dependencies
        if: steps.bun_lock_check.outputs.found == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun
            apps/latch-auth/node_modules
          key: bun-deps-${{ runner.os }}-lockfile-${{ hashFiles('apps/latch-auth/bun.lock') }}
          restore-keys: |
            bun-deps-${{ runner.os }}-

      - name: Install Dependencies
        working-directory: apps/latch-auth
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client
        working-directory: apps/latch-auth
        run: bunx prisma generate

      - name: Wait for PostgreSQL
        run: |
          echo "Waiting for PostgreSQL..."
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U latch -d latch_auth && echo "✅ Postgres ready" && exit 0
            sleep 2
          done
          echo "❌ PostgreSQL failed to start"
          exit 1

      - name: Install Redis CLI
        run: sudo apt-get update && sudo apt-get install -y redis-tools
        
      - name: Wait for Redis
        run: |
          echo "Waiting for Redis..."
          for i in {1..15}; do
            if redis-cli -h localhost ping | grep -q "PONG"; then
              echo "✅ Redis ready"
              exit 0
            fi
            sleep 1
          done
          echo "❌ Redis failed to start"
          exit 1

      - name: Apply Prisma Migrations
        working-directory: apps/latch-auth
        run: bunx prisma migrate deploy

      - name: Run Prisma Seed
        working-directory: apps/latch-auth
        run: bun run prisma:seed

      - name: Verify Seed Presence
        working-directory: apps/latch-auth
        run: bun prisma/seed-check.ts

      - name: Run E2E Tests with Coverage
        working-directory: apps/latch-auth
        run: |
          mkdir -p ${{ env.CI_ARTIFACT_PATH }}
          bunx jest --ci --testEnvironment node \
            --reporters=default \
            --reporters=jest-junit \
            --outputFile=${{ env.CI_ARTIFACT_PATH }}/junit.xml \
            --coverage \
            --coverageDirectory=coverage

      - name: Debug- Check coverage output
        working-directory: apps/latch-auth
        run: |
          ls -la coverage/ || echo "Coverage missing!"        

      - name: Build Docker Image (Prod-like)
        working-directory: apps/latch-auth
        run: docker build --no-cache -t latch-auth:e2e -f Dockerfile .

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run Latch Auth in Docker (with service network)
        run: |
          # Detect the Docker network that includes the 'postgres' container
          NETWORK=$(docker inspect postgres --format '{{json .NetworkSettings.Networks}}' | jq -r 'keys[0]')
          
          if [ -z "$NETWORK" ] || [ "$NETWORK" = "null" ]; then
            echo "⚠️ Failed to detect Docker network; falling back to 'host' mode"
            NETWORK="host"
            DB_HOST="localhost"
            REDIS_HOST="localhost"
          else
            echo "✅ Detected Docker network: $NETWORK"
            DB_HOST="postgres"
            REDIS_HOST="redis"
          fi
      
          docker run -d --name latch_auth_test -p 3000:3000 \
            --network "$NETWORK" \
            -e DATABASE_URL="postgresql://latch:latch123@${DB_HOST}:5432/latch_auth" \
            -e REDIS_URL="redis://${REDIS_HOST}:6379" \
            -e EVENT_SIGNING_SECRET="mock-signing-secret" \
            -e NODE_ENV=test \
            latch-auth:e2e
      
          echo "Waiting for API to boot..."
          for i in {1..40}; do
            if curl -fsS http://localhost:3000/v1/health >/dev/null 2>&1; then
              echo "✅ API is healthy!"
              break
            fi
            sleep 2
          done

      - name: Final Health Check
        run: |
          curl -f http://localhost:3000/v1/health || (echo "❌ Health check failed" && docker logs latch_auth_test && exit 1)
          echo '{"health":"ok","checkedAt":"'"$(date -u +"%Y-%m-%dT%H:%M:%SZ")"'"}' > ${{ env.CI_ARTIFACT_PATH }}/health.json

      - name: Install xmllint (for JUnit parsing)
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - name: Generate Summary for PR
        id: summary
        working-directory: apps/latch-auth
        run: |
          TEST_SUMMARY="❓ E2E results unavailable"
          JUNIT="latch-auth-ci-artifacts/junit.xml"
          ls -la latch-auth-ci-artifacts/ || echo "junit dir missing"
          stat latch-auth-ci-artifacts/junit.xml || echo "junit.xml missing"
          if [ -f "$JUNIT" ]; then
            TOTAL=$(xmllint --xpath 'string(count(//testcase))' "$JUNIT")
            FAILURES=$(xmllint --xpath 'string(count(//testcase[failure]))' "$JUNIT")
            if [ "$FAILURES" -eq 0 ]; then
              TEST_SUMMARY="✅ E2E passed ($TOTAL tests)"
            else
              TEST_SUMMARY="❌ E2E failed: $FAILURES/$TOTAL"
            fi
          fi

          COVERAGE_SUMMARY="❓ Coverage unavailable"
          if [ -f "coverage/lcov.info" ]; then
            COV_LINE=$(grep -m1 "LH:" coverage/lcov.info | awk -F: '{print $2"%"}')
            COVERAGE_SUMMARY="📊 Coverage: ${COV_LINE:-available}"
          fi

          SUMMARY="$TEST_SUMMARY | $COVERAGE_SUMMARY"
          echo "text=$SUMMARY" >> $GITHUB_OUTPUT

      - name: Post summary to PR
        
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          message: ${{ steps.summary.outputs.text }}

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latch-auth-e2e-results
          path: |
            apps/latch-auth/${{ env.CI_ARTIFACT_PATH }}
            apps/latch-auth/junit.xml
            apps/latch-auth/coverage
          if-no-files-found: ignore

      - name: Cleanup Docker images
        if: always()
        run: docker rmi latch-auth:e2e || true
        
      - name: Cleanup Docker
        if: always()
        run: |
          docker rm -f latch_auth_test 2>/dev/null || true
        
      - name: Cleanup Docker System
        if: always()
        run: docker system prune -f
        
      